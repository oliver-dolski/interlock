# CI for interlock.
#
# The unit suite runs on both ubuntu-latest and windows-latest because the people who will
# run this tool mostly sit on Windows: a suite green only on Linux would not prove that the
# CLI and the report writers work where they are used. Every command is a plain
# `python -m ...`, so it behaves the same under bash on Ubuntu and pwsh on Windows.
#
# The lab (Docker Compose: a LibOSDP peripheral, a control panel and the attacker container)
# runs only on ubuntu-latest. Hosted Windows runners run Windows containers only, so the
# Linux lab images cannot start there; that is a runner limit, not a gap in the matrix.
#
# Every action is pinned to an exact release tag that was checked to exist, never to a
# moving major tag such as `@v7`: a major tag is a pointer the publisher can move at any
# time, and some publishers stop publishing major tags at all, which makes the job fail to
# resolve. Only first-party actions/* are used, the token is read-only and no secret is read.

name: ci

# Quoted on purpose: YAML 1.1 parsers read a bare `on` as the boolean true. GitHub Actions
# accepts both forms.
"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ruff check only: `ruff format --check` is left out of v0.1.0 (23 files would be reformatted).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not lab"

  # The sdist is checked against the same allow-list the release machine uses, so a file that
  # must never ship fails here instead of on PyPI.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/check_dist.py dist
      - run: twine check --strict dist/*

  # The real assessment against the bundled lab, from a non-editable install, so the entry
  # points come from the built wheel. The step's own exit status requires exit 0. No Docker
  # layer caching: a cold image build takes under a minute, and caching would need changes
  # to the compose files users run.
  lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install .
      - run: docker compose version
      - run: interlock osdp assess -o lab-smoke/assessment.md
      - name: Both reports carry the authorized-use notice
        run: |
          python -c "
          import json, pathlib
          from interlock.report import AUTHORIZED_USE_NOTICE
          md = pathlib.Path('lab-smoke/assessment.md').read_text(encoding='utf-8')
          doc = json.loads(pathlib.Path('lab-smoke/assessment.json').read_text(encoding='utf-8'))
          assert AUTHORIZED_USE_NOTICE in md, 'the Markdown report lacks the notice'
          assert doc['notice'] == AUTHORIZED_USE_NOTICE, 'the JSON report notice differs'
          print('both reports carry the authorized-use notice')
          "
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lab-smoke-reports
          path: lab-smoke/

  # The whole lab suite takes long enough to stay off every push; run it by hand from the
  # Actions tab.
  lab-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m lab

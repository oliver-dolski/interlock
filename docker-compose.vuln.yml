# cve-replay override: swap the pd and cp services onto the deliberately
# vulnerable libosdp v2.4.0 image (Dockerfile.vuln) for the cve-replay profile.
# Layer this on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.vuln.yml up
#
# or via the wrapper: `sh ./lab.sh up cve-replay`.
#
# The v2.4.0 C-ext API has no user-defined TCP channel (only uart/msgq/fifo/
# unix_bus), so the vuln pd and cp talk over a shared-volume named pipe (fifo)
# instead of the TCP path the fixed profiles use. The attacker service - idle in
# accept() on the base file's TCP proxy, since the vuln CP never dials it over TCP -
# is re-homed below onto that same fifo bus (plan 04-08 Task 1, ATK-05b wave-0 spike).
#
# Containment is unchanged (SAFE-01): labnet stays internal: true (inherited), no
# service adds a ports: section, and the fifo bus is a local named volume with no
# host bind mount, so nothing is published or reachable from outside the lab. The
# vuln image is reachable only via this override (SAFE-03).

services:
  pd:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    image: interlock-lab-vuln
    working_dir: /app/lab/vuln
    command: ["python", "pd_driver.py"]
    volumes:
      - osdp_bus:/busvol

  cp:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    image: interlock-lab-vuln
    working_dir: /app/lab/vuln
    command: ["python", "cp_driver.py"]
    volumes:
      - osdp_bus:/busvol

  # ATK-05b: re-home the attacker from the inherited, idle Phase 2 TCP proxy (the
  # vuln CP never dials it over TCP) to sit INLINE on the cve-replay fifo bus via
  # lab/attacker/fifo_relay.py - the CP talks to the relay, the relay talks to the
  # PD (a passive tap would starve the PD, since a fifo has no broadcast mode).
  # Mounts ./src and ./lab read-only (code only, no egress) so the relay entrypoint
  # runs without rebuilding the base attacker image, and the shared osdp_bus volume
  # so it can create the CP-side pipes and open the PD-side ones. No ports: section
  # is added here (SAFE-01 containment unchanged); the buses stay local named volumes.
  attacker:
    working_dir: /app/lab/attacker
    environment:
      PYTHONPATH: /app/src
    command: ["python", "fifo_relay.py"]
    volumes:
      - ./src:/app/src:ro
      - ./lab:/app/lab:ro
      - osdp_bus:/busvol

volumes:
  # Local named volume carrying the fifo bus between pd and cp. Not a host bind
  # mount: the bus stays inside the lab (SAFE-01).
  osdp_bus:

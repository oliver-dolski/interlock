[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interlock"
version = "0.1.0"
description = "Extensible red-team and security-assessment platform for OT, edge, and physical-security devices."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
interlock = "interlock.cli:app"

[project.entry-points."interlock.plugins"]
demo = "interlock.plugins.demo:DemoPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/interlock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Typer requires calling typer.Argument / typer.Option in parameter defaults;
# treat them as immutable so flake8-bugbear B008 does not flag the idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode lets same-named test modules coexist across directories
# (tests/osdp/test_codec_roundtrip.py and tests/lab/test_codec_roundtrip.py) without
# __init__.py packaging; the legacy prepend mode rejects duplicate basenames.
addopts = "--import-mode=importlib"
markers = [
    "lab: integration tests that require Docker (deselect with -m 'not lab')",
]

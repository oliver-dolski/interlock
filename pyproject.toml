[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interlock"
version = "0.1.0"
description = "Extensible red-team and security-assessment platform for OT, edge, and physical-security devices."
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression (PEP 639); it replaces the License trove classifier, so none is listed below.
license = "Apache-2.0"
authors = [{ name = "Oliver Dolski", email = "oliver.dolski1@gmail.com" }]
keywords = [
    "osdp",
    "access-control",
    "red-team",
    "ot-security",
    "mitre-attack",
    "security-assessment",
    "libosdp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    # AES-128-ECB for SCBK-D detection in 03-04 (OSDP-03) and weak-key work in Phase 4.
    "cryptography>=43",
    # Serial endpoint for the pty tap (03-02) and the Phase 4 path to real RS-485 (SAFE-02).
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    # Build the sdist and wheel and check their metadata; development and CI only.
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/oliver-dolski/interlock"
Source = "https://github.com/oliver-dolski/interlock"
Issues = "https://github.com/oliver-dolski/interlock/issues"
Documentation = "https://github.com/oliver-dolski/interlock/blob/main/docs/plugin-authoring.md"

[project.scripts]
interlock = "interlock.cli:app"

[project.entry-points."interlock.plugins"]
demo = "interlock.plugins.demo:DemoPlugin"

# A plugin's CLI command group is discovered from this group (D-04).
[project.entry-points."interlock.commands"]
osdp = "interlock.osdp.attacks:build_osdp_app"

[tool.hatch.build.targets.wheel]
packages = ["src/interlock"]

# hatchling honours .gitignore but not .git/info/exclude, so the sdist names what it carries
# instead of trusting the tree. scripts/check_dist.py enforces the same list on the archive.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/interlock",
    "tests",
    "lab",
    "docs",
    "Dockerfile",
    "Dockerfile.vuln",
    "lab.sh",
    "docker-compose.yml",
    "docker-compose.tap.yml",
    "docker-compose.fuzz.yml",
    "docker-compose.downgrade.yml",
    "docker-compose.spoof.yml",
    "docker-compose.replay.yml",
    "docker-compose.cve.yml",
    "docker-compose.vuln.yml",
    "docker-compose.lockstate.yml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = ["docs/media", "__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Typer requires calling typer.Argument / typer.Option in parameter defaults;
# treat them as immutable so flake8-bugbear B008 does not flag the idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode lets same-named test modules coexist across directories
# (tests/osdp/test_codec_roundtrip.py and tests/lab/test_codec_roundtrip.py) without
# __init__.py packaging; the legacy prepend mode rejects duplicate basenames.
addopts = "--import-mode=importlib"
markers = [
    "lab: integration tests that require Docker (deselect with -m 'not lab')",
]
